manifestVersion: 1
id: bwtai-asciiflow
name: ASCIIFlow
tagline: Draw ASCII diagrams in your browser
category: utilities
version: "1.0.0"
port: 8092
icon: https://raw.githubusercontent.com/BuiltWitAI/umbrel-apps/master/bwtai-asciiflow/icon.png
description: >-
  ASCIIFlow is a simple, web-based tool for drawing ASCII diagrams and flowcharts.

  Features: Grid-based canvas for precise alignment; Box, line, and arrow drawing tools; Text labels and shapes; Export to plain text, HTML, or image; Keyboard shortcuts for fast editing; Works entirely in the browser; No account required.

  Use cases: Architecture diagrams; Network topologies; Process flows; Code comments and documentation; Terminal-friendly diagrams; Quick wireframes.

  All drawing happens locally in the browser - no server-side processing.
