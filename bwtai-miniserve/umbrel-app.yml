manifestVersion: 1
id: bwtai-miniserve
name: miniserve
tagline: Simple, fast static file server over HTTP
category: utilities
version: "0.22.0"
port: 8095
icon: https://raw.githubusercontent.com/BuiltWitAI/umbrel-apps/master/bwtai-miniserve/icon.png
description: >-
  miniserve is a small, self-contained cross-platform CLI tool to serve files and directories over HTTP.

  Features: Easy to use - just works; Correct MIME types handling out of the box; Single binary with no extra dependencies; Authentication support (username/password, hashed passwords); Mega fast and highly parallel (Rust + Actix); Search/filter by file or directory name; Folder download (compressed on the fly as .tar.gz or .zip); File uploading and directory creation; Pretty themes (light/dark); QR code display for quick access; TLS support; README.md rendering like GitHub; Range requests; WebDAV support; Healthcheck route.

  Use cases: Quick file sharing between devices; Serving local directories over LAN; Temporary file server for development; Simple file hosting; Directory listings with download; QR code access from mobile.

  Built in Rust with Actix web framework. Runs as a single static binary.
developer: svenstaro
website: https://github.com/svenstaro/miniserve
submitter: BuiltWitAI
