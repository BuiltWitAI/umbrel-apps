version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: miniserve
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  miniserve:
    image: svenstaro/miniserve:latest
    restart: on-failure
    command: ["/data", "--port", "8080", "--verbose", "--index", "index.html", "--spa"]
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - MINISERVE_PORT=8080
      - MINISERVE_INTERFACE=0.0.0.0