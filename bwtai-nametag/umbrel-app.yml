name: Nametag
tagline: Personal Relationship Manager - remember people and connections
category: utilities
version: "1.0.0"
port: 8094
icon: https://raw.githubusercontent.com/BuiltWitAI/umbrel-apps/master/bwtai-nametag/icon.png
description: >-
  Nametag is a personal relationship manager that helps you remember the people in your life and how they're connected. Track birthdays, contact information, how people are connected, and visualize your network as an interactive graph.

  Features: Track people with flexible attributes (name, birthday, important dates, photos, custom fields); Map relationships between people with custom relationship types; Visualize your network with interactive force-directed graphs; Organize contacts into custom groups; Interactive map view with geocoded addresses and clustered markers; Journal for logging interactions and notes over time; Set reminders for important dates and staying in touch; CardDAV sync with Google Contacts, iCloud, Outlook, and Nextcloud; vCard and JSON import/export; Duplicate detection and contact merging; Global fuzzy search with accent-insensitive matching; REST API with OpenAPI documentation and token authentication; OIDC / SSO authentication support; Installable as a PWA; Trash with soft-delete and restore; Bulk operations; Messaging app quick links (WhatsApp, Signal, Telegram, and more); Full dark and light theme support; Multiple languages (English, Spanish, Japanese, Norwegian, German, Chinese, Italian, Russian, Dutch); Mobile-responsive design; Multi-platform Docker support (AMD64 and ARM64).

  Uses PostgreSQL and Redis for data storage and caching.
