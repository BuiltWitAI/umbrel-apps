version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: bwtai-nametag_app_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  app:
    image: ghcr.io/mattogodoy/nametag:latest
    restart: on-failure
    environment:
      - NEXTAUTH_URL=http://umbrel.local:3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=nametag_db
      - DB_USER=nametag
      - DB_PASSWORD=${DB_PASSWORD}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - CRON_SECRET=${CRON_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - DISABLE_REGISTRATION=false
    volumes:
      - ${APP_DATA_DIR}/data/photos:/app/data/photos
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: nametag
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: nametag_db
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nametag -d nametag_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    user: "1000:1000"
    image: redis:7-alpine
    restart: on-failure
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s