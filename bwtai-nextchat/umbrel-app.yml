description: |
  NextChat (formerly ChatGPT-Next-Web) is a cross-platform chat UI for AI models.

  Features:
  - Supports OpenAI, Azure OpenAI, Google Gemini, Anthropic Claude, and custom OpenAI-compatible APIs
  - Privacy-first: all data stored locally in browser
  - Markdown support: LaTeX, mermaid, code highlighting
  - PWA support, responsive design, dark mode
  - MCP (Model Context Protocol) support
  - Prompt templates and awesome prompts built-in
  - I18n: 20+ languages
  - One-click deploy with Docker
