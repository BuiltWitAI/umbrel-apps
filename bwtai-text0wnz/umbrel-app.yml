icon: https://raw.githubusercontent.com/BuiltWitAI/umbrel-apps/master/bwtai-text0wnz/icon.png
description: >-
  text0wnz is a collaborative text and ASCII art editor with real-time multi-user editing capabilities.

  Features: Real-time collaborative editing via WebSockets; ASCII art creation with multiple fonts; Syntax highlighting; Auto-save and persistence; HTTPS via Caddy with automatic certificates; Dark/light theme support; Mobile-responsive design; WebSocket proxy for real-time sync.

  Use cases: Collaborative coding/notes; ASCII art creation; Real-time document editing; Team brainstorming; Teaching/demos.

  Built with Bun (backend) and Caddy (reverse proxy/HTTPS). Single container with multi-architecture support (amd64, arm64).
