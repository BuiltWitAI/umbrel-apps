icon: https://raw.githubusercontent.com/BuiltWitAI/umbrel-apps/master/bwtai-jsoncrack/icon.png
description: >-
  JSON Crack is an open-source visualization application that transforms various data formats (JSON, YAML, XML, CSV) into interactive graphs.

  Features: Visualizer (convert JSON, YAML, CSV, XML into interactive graphs/trees), Format & Validate (beautify and validate JSON, YAML, CSV), Convert (transform between formats like JSON to CSV or XML to JSON), Code Generation (TypeScript interfaces, Go structs, Kotlin data classes, Rust serde, JSON Schema), JSON Schema (create and validate), Advanced Tools (jq and JSONPath queries), Export (PNG, JPEG, SVG), Dark/Light mode support, Privacy (all processing happens locally in your browser).

  Supported formats: JSON, YAML, CSV, XML, TOML, protobuf, MessagePack (partial).

  Runs entirely in the browser - your data never leaves your device.
