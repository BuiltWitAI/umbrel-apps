icon: https://raw.githubusercontent.com/BuiltWitAI/umbrel-apps/master/bwtai-jsoncrack/icon.png
description: >-
  JSON Crack is an open-source visualization application that transforms various data formats (JSON, YAML, XML, CSV) into interactive graphs.

  **Features:**
  - **Visualizer**: Convert JSON, YAML, CSV, XML into interactive graphs/trees
  - **Format & Validate**: Beautify and validate JSON, YAML, CSV
  - **Convert**: Transform between formats (JSON ↔ CSV ↔ YAML ↔ XML)
  - **Code Generation**: Generate TypeScript interfaces, Go structs, Kotlin data classes, Rust serde, JSON Schema
  - **JSON Schema**: Create and validate JSON Schema
  - **Advanced Tools**: Run jq and JSONPath queries
  - **Export**: Download visualizations as PNG, JPEG, SVG
  - **Dark/Light mode** support
  - **Privacy**: All processing happens locally in your browser

  **Supported formats:**
  - JSON, YAML, CSV, XML
  - TOML, protobuf, MessagePack (partial)

  Runs entirely in the browser - your data never leaves your device.
