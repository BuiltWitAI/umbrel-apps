tagline: The Cyber Swiss Army Knife - web app for encryption, encoding, compression and data analysis
category: utilities
version: "11.4.0"
port: 8089
icon: https://raw.githubusercontent.com/BuiltWitAI/umbrel-apps/master/bwtai-cyberchef/icon.png
description: |
  CyberChef is a simple, intuitive web app for carrying out all manner of "cyber" operations within a web browser.

  **Operations include:**
  - **Encoding/Decoding**: Base64, URL, Hex, HTML entities, XOR, ROT13
  - **Encryption**: AES, DES, Blowfish, RC4, Rabbit, ChaCha
  - **Compression**: Gzip, Deflate, LZMA, Zlib
  - **Hashing**: MD5, SHA-1, SHA-256, SHA-512, RIPEMD, CRC32
  - **Networking**: IP address conversion, CIDR, IPv6 parsing
  - **Data formats**: JSON, XML, YAML, CSV, Protobuf parsing
  - **File analysis**: Hexdump, magic bytes, PE/ELF parsing
  - **And 200+ more operations**

  **Features:**
  - Drag-and-drop recipe builder
  - Auto-bake (real-time output)
  - Magic (automated encoding detection)
  - Breakpoints and step-through debugging
  - Save/load recipes locally
  - Deep linking via URL
  - Works entirely client-side - no data sent to server
  - Dark/light theme support

  All processing happens in your browser - your data never leaves your device.

