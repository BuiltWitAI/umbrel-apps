manifestVersion: 1
id: bwtai-meilisearch
name: Meilisearch
tagline: Lightning-fast search engine with hybrid search
category: utilities
version: "1.11.0"
port: 8085
icon: https://raw.githubusercontent.com/BuiltWitAI/umbrel-apps/master/bwtai-meilisearch/icon.svg
description: |
  Meilisearch is an open-source, lightning-fast search engine that fits effortlessly into your apps, websites, and workflow.

  Features:
  - **Hybrid search**: Combine semantic and full-text search for most relevant results
  - **Search-as-you-type**: Results in <50ms for intuitive experience
  - **Typo tolerance**: Relevant matches even with misspellings
  - **Filtering & faceted search**: Custom filters, faceted search interface
  - **Sorting**: Sort by price, date, or any field
  - **Synonym support**: Configure synonyms for better results
  - **Geosearch**: Filter/sort by geographic data
  - **Multi-language**: Optimized for Chinese, Japanese, Hebrew, Latin scripts
  - **Security**: Fine-grained API keys, multi-tenancy with tenant tokens
  - **RESTful API**: Easy integration with SDKs for many languages
  - **AI-ready**: Works with LangChain and MCP
  - **Scalable**: Replication and sharding for horizontal scaling

  The web dashboard is available at the app URL for managing indexes and testing searches.

