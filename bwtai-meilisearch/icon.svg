<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Meilisearch logo - simplified from their official logo -->
  <defs>
    <linearGradient id="meiliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF3D00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="224" height="224" rx="32" fill="url(#meiliGrad)"/>

  <!-- Magnifying glass icon -->
  <g transform="translate(128, 128)" fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lens circle -->
    <circle cx="-24" cy="-24" r="40"/>
    <!-- Handle -->
    <line x1="8" y1="8" x1="40" y2="40"/>
    <!-- Search "sparkle" indicator -->
    <g stroke-width="8" stroke="white" opacity="0.9">
      <line x1="-56" y1="-56" x2="-64" y2="-64"/>
      <line x1="-56" y1="-48" x2="-64" y2="-40"/>
      <line x1="-48" y1="-56" x2="-40" y2="-64"/>
    </g>
  </g>
</svg>