version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: meilisearch
      APP_PORT: 7700
      PROXY_AUTH_ADD: "false"

  meilisearch:
    image: getmeili/meilisearch:latest
    restart: on-failure
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
    volumes:
      - ${APP_DATA_DIR}/data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:7700/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3