description: |
  All is Cubes is a voxel game engine where each ordinary block is itself made out of smaller blocks (one level of recursion). The game runs in browsers using WebGPU and WebAssembly.

  Features:
  - Recursive voxel rendering (blocks made of blocks)
  - WebGPU-accelerated rendering with WebGL fallback
  - Procedural content generation (Sponza Atrium demo scene)
  - Runs entirely in the browser - no installation needed
  - Open source (MIT/Apache-2.0)

  This is the web edition served as a static site. The game requires a browser with WebGPU support (Chrome 113+, Edge 113+, Firefox 114+ with flag) or WebGL 2 fallback.

  Note: This is an early development version. Many features are not yet implemented.
