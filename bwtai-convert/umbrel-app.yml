manifestVersion: 1
id: bwtai-convert
name: Convert
tagline: Truly universal online file converter
category: utilities
version: "1.0.0"
port: 8089
icon: https://raw.githubusercontent.com/BuiltWitAI/umbrel-apps/master/bwtai-convert/icon.png
description: >-
  Convert is a truly universal file converter that works entirely in your browser (client-side). No files are uploaded to any server — everything runs locally using WebAssembly and JavaScript.

  Features: Convert between 100+ formats across images, video, audio, documents, archives, code, 3D models, fonts, and more; Cross-medium conversions (e.g., video to GIF, PDF to images, audio to video); No server-side processing — complete privacy; Runs offline once loaded (PWA support); Self-hosted on your Umbrel.

  Supported categories: Image, Video, Audio, Document, Archive, Code, 3D Model, Font, eBook, and more.
