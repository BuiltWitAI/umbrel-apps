version: "1.0.0"
port: 3001
description: |
  FreeLLMAPI aggregates free tiers from 29+ LLM providers (Google, Groq, Cerebras, OpenRouter, Mistral, Cohere, NVIDIA, HuggingFace, and more) behind a single OpenAI-compatible `/v1` API.

  Features:
  - 4 billion tokens/month across 358 free model endpoints
  - Automatic fallback when a provider is rate-limited
  - Encrypted API key storage
  - Works with any OpenAI-compatible client (Claude Code, Codex, Cursor, Aider, etc.)
  - Web dashboard to manage keys and monitor usage
  - Per-provider daily caps and timeouts
  - Image normalization and request compression

  Simply add your provider API keys in the dashboard and point any OpenAI client to `http://umbrel.local:3001/v1`.

