version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bwtai-d9_web_1
      APP_PORT: 8055
      PROXY_AUTH_ADD: "false"

  web:
    image: lawebcapsule/d9:12.5.4@sha256:480be8c9ac39e20110d5069f30b825bebfe7acb4ea12f46fe49b6ba416248703
    restart: on-failure
    environment:
      - DB_CLIENT=sqlite3
      - DB_FILENAME=/directus/database/database.sqlite
      - EXTENSIONS_PATH=/directus/extensions
      - STORAGE_LOCAL_ROOT=/directus/uploads
    volumes:
      - ${APP_DATA_DIR}/data/uploads:/directus/uploads
      - ${APP_DATA_DIR}/data/database:/directus/database
      - ${APP_DATA_DIR}/data/extensions:/directus/extensions