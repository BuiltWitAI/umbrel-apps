name: Chess vs Bot
tagline: Play chess against an AI opponent in your browser
category: games
version: "1.0.0"
port: 8086
icon: https://raw.githubusercontent.com/BuiltWitAI/umbrel-apps/master/bwtai-chess/icon.svg
description: |
  Play chess against a computer opponent directly in your browser.

  Features:
  - **Three difficulty levels**: Easy (random), Medium (Minimax depth 2), Hard (Minimax depth 3)
  - **Alpha-beta pruning** AI with piece-square tables for positional evaluation
  - **Legal move highlighting** and drag-and-drop piece movement
  - **Move history** with standard algebraic notation
  - **Undo move** functionality
  - **Flip board** to play as Black
  - **Responsive design** works on mobile and desktop
  - **Check/checkmate/stalemate detection**
  - **No server-side computation** - runs entirely in browser

  The AI uses a minimax algorithm with alpha-beta pruning and evaluates positions using material values and piece-square tables. On "Hard" difficulty, it looks 3 moves ahead.

