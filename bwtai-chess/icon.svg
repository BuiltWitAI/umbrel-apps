<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="chessGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A252F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E8E8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34495E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A252F;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#chessGrad)" rx="24"/>

  <!-- Chess board (4x4 mini) -->
  <g transform="translate(48, 48)">
    <rect x="0" y="0" width="160" height="160" fill="url(#blackGrad)" rx="8"/>
    <g fill="url(#whiteGrad)">
      <rect x="0" y="0" width="40" height="40"/>
      <rect x="80" y="0" width="40" height="40"/>
      <rect x="40" y="40" width="40" height="40"/>
      <rect x="120" y="40" width="40" height="40"/>
      <rect x="0" y="80" width="40" height="40"/>
      <rect x="80" y="80" width="40" height="40"/>
      <rect x="40" y="120" width="40" height="40"/>
      <rect x="120" y="120" width="40" height="40"/>
    </g>
    
    <!-- White King on e1 (4, 0 in 0-indexed) -->
    <g transform="translate(100, 20)" fill="#FFFFFF" stroke="#1A252F" stroke-width="2">
      <ellipse cx="0" cy="8" rx="14" ry="6"/>
      <path d="M-10,4 Q-10,-8 0,-14 Q10,-8 10,4" fill="none" stroke="#1A252F" stroke-width="2"/>
      <path d="M-6,-4 Q-6,-10 0,-16 Q6,-10 6,-4" fill="#FFD700" stroke="#B8860B" stroke-width="1"/>
      <circle cx="0" cy="-18" r="3" fill="#FFD700"/>
    </g>
    
    <!-- Black King on e8 (4, 7 in 0-indexed) -->
    <g transform="translate(100, 140)" fill="#1A252F" stroke="#FFFFFF" stroke-width="2">
      <ellipse cx="0" cy="8" rx="14" ry="6"/>
      <path d="M-10,4 Q-10,-8 0,-14 Q10,-8 10,4" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M-6,-4 Q-6,-10 0,-16 Q6,-10 6,-4" fill="#FFD700" stroke="#B8860B" stroke-width="1"/>
      <circle cx="0" cy="-18" r="3" fill="#FFD700"/>
    </g>
  </g>

  <!-- "vs" text -->
  <text x="128" y="220" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ECF0F1" text-anchor="middle">vs</text>
</svg>