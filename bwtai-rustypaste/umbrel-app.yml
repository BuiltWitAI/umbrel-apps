manifestVersion: 1
id: bwtai-rustypaste
name: Rustypaste
tagline: Minimal file upload/pastebin service
category: files
version: "1.6.0"
port: 8090
description: |
  Rustypaste is a minimal file upload and pastebin service written in Rust.

  Features:
  - File upload, URL shortening, and upload from URL
  - Random file names (pet names like "capital-mosquito.txt")
  - Expiring links with auto-deletion
  - One-shot links (view once)
  - Password-protected files with Argon2id hashing
  - No duplicate uploads
  - MIME type detection
  - Single binary, no database (filesystem storage)
  - Easy to deploy via Docker
developer: orhun
submitter: BuiltWitAI
submission: https://github.com/BuiltWitAI/umbrel-apps
