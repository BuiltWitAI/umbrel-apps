version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: rustypaste
      APP_PORT: 8000
      PROXY_AUTH_ADD: "false"

  rustypaste:
    image: orhunp/rustypaste:latest
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/upload:/app/upload
      - ${APP_DATA_DIR}/config.toml:/app/config.toml:ro
    environment:
      - RUST_LOG=info