manifestVersion: 1
id: bwtai-faved
name: Faved
tagline: Free open-source bookmark manager with customizable nested tags
category: utilities
version: "1.0.0"
port: 8080
icon: https://raw.githubusercontent.com/BuiltWitAI/umbrel-apps/master/bwtai-faved/icon.png
description: |
  Faved is a private open-source bookmark manager built to handle large collections and advanced use cases. Optimized for ease-of-use and efficiency.

  Features:
  - Nested tags with customizable colors and descriptions for structured bookmark organization
  - Smart bookmark management with automatic title/description/image fetching and duplicate detection
  - Powerful responsive UI with instant search, bulk actions, customizable layouts (card/list/table)
  - Chrome browser extension and lightweight browser bookmarklet for saving from any browser
  - Apple Shortcuts integration for native share sheet on iOS/MacOS/iPadOS
  - Import from Chrome, Safari, Firefox, Edge, Raindrop.io, Pocket with nested tag preservation
  - PWA support for app-like experience on mobile
  - Light/Dark mode with system sync
  - All data stored locally (SQLite)
  - Super fast and lightweight

developer: denho
website: https://faved.to
submitter: BuiltWitAI
submission: https://github.com/BuiltWitAI/umbrel-apps
repo: https://github.com/denho/faved
support: https://github.com/denho/faved/issues
gallery:
  - https://github.com/user-attachments/assets/24b08a59-61dd-48a4-a954-d58375fb3c57
releaseNotes: |
  Initial release of Faved for Umbrel.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
backupIgnore:
  - storage/*