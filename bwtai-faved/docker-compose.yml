services:
  app_proxy:
    environment:
      APP_HOST: bwtai-faved_apache-php_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  apache-php:
    image: denho/faved:latest@sha256:ca2eef7bea9d711379941235786e91e44bceb985c69b194ce063c01969ad3c08
    restart: on-failure
    working_dir: /var/www/html
    volumes:
      - ${APP_DATA_DIR}/data/storage:/var/www/html/storage/
      - ${APP_DATA_DIR}/data/temp:/tmp/
      - ${APP_DATA_DIR}/data/apache-conf:/etc/apache2/sites-enabled/
      - ${APP_DATA_DIR}/data/certbot-conf:/etc/letsencrypt/
    environment:
      - PORT=80
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s