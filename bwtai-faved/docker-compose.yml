version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: apache-php
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  apache-php:
    image: denho/faved:latest
    restart: on-failure
    working_dir: /var/www/html
    volumes:
      - ${APP_DATA_DIR}/data/storage:/var/www/html/storage/
      - ${APP_DATA_DIR}/data/temp:/tmp/
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s