version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: web
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: on-failure
    environment:
      POSTGRES_USER: opencut
      POSTGRES_PASSWORD: moneyprintergobrrr
      POSTGRES_DB: opencut
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencut"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  redis:
    user: "1000:1000"
    image: redis:7-alpine@sha256:e647cfe134bf5e8e74e620f66346f93418acfc240b71dd85640325cb7cd01402
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  serverless-redis-http:
    image: hiett/serverless-redis-http:latest
    restart: on-failure
    environment:
      SRH_MODE: env
      SRH_TOKEN: moneyprintergobrrr
      SRH_CONNECTION_STRING: redis://:moneyprintergobrrr@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  web:
    image: ghcr.io/opencut-app/opencut-classic-web:latest
    restart: on-failure
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://opencut:moneyprintergobrrr@db:5432/opencut
      - BETTER_AUTH_SECRET=your-production-secret-key-here
      - UPSTASH_REDIS_REST_URL=http://serverless-redis-http:80
      - UPSTASH_REDIS_REST_TOKEN=moneyprintergobrrr
      - NEXT_PUBLIC_SITE_URL=http://umbrel.local:3100
      - NEXT_PUBLIC_MARBLE_API_URL=https://api.marblecms.com
      - MARBLE_WORKSPACE_KEY=placeholder
      - FREESOUND_CLIENT_ID=
      - FREESOUND_API_KEY=
    volumes:
      - ${APP_DATA_DIR}/data/web:/app/data
    depends_on:
      db:
        condition: service_healthy
      serverless-redis-http:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s