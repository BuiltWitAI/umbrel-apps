tagline: Open-source CapCut alternative — video editor for web
category: media
version: "1.0.0"
port: 3100
icon: https://raw.githubusercontent.com/OpenCut-app/OpenCut/refs/heads/main/apps/web/public/favicon.ico
description: |
  OpenCut is a free and open-source video editor that runs in your browser, desktop, and mobile. A privacy-first alternative to CapCut.

  Features:
  - Timeline-based video editing with multi-track support
  - Video, audio, and image layers with effects and transitions
  - Text, stickers, and subtitle support
  - Keyframe animation for position, scale, rotation, opacity
  - Export to MP4, WebM, GIF with custom settings
  - Privacy-first: all processing happens locally in your browser
  - No account required, no cloud upload
  - Plugin architecture for custom effects and tools
  - Rust core for performance (WASM in browser)
  - Project management with autosave

  Self-hosted on your Umbrel — your videos never leave your device.

  Data stored in PostgreSQL (projects, settings) and Redis (sessions, cache).

