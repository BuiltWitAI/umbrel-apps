icon: https://raw.githubusercontent.com/BuiltWitAI/umbrel-apps/master/bwtai-opencut/icon.png
description: |
  OpenCut is a privacy-first, open-source web video editor. It runs video rendering directly in your browser using WebAssembly (FFmpeg.wasm) without uploading raw video files.

  **Features:**
  - Full video editing in the browser (cut, trim, transitions, effects)
  - Local processing - your media never leaves your device
  - Timeline-based editor with multiple tracks
  - Text, subtitles, and overlay support
  - Export to various formats
  - Modern React/Next.js UI with Tailwind CSS

  **Requirements:**
  - Modern browser with WebAssembly and SharedArrayBuffer support (Chrome 68+, Firefox 79+, Safari 15.4+, Edge 79+)
  - Client device must have sufficient RAM/CPU for video processing
  - Umbrel server only serves the app - all rendering happens client-side

  **Note:** This app requires PostgreSQL and Redis for session management and project persistence.

