<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="opencutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="256" height="256" rx="32" fill="url(#opencutGrad)"/>

  <!-- Film strip / timeline representation -->
  <g transform="translate(32, 64)">
    <!-- Film strip main body -->
    <rect x="0" y="0" width="192" height="128" rx="8" fill="#1E1E2E"/>
    
    <!-- Sprocket holes (top and bottom) -->
    <g fill="#7C3AED">
      <rect x="8" y="8" width="16" height="16" rx="2"/>
      <rect x="44" y="8" width="16" height="16" rx="2"/>
      <rect x="80" y="8" width="16" height="16" rx="2"/>
      <rect x="116" y="8" width="16" height="16" rx="2"/>
      <rect x="152" y="8" width="16" height="16" rx="2"/>
      <rect x="8" y="104" width="16" height="16" rx="2"/>
      <rect x="44" y="104" width="16" height="16" rx="2"/>
      <rect x="80" y="104" width="16" height="16" rx="2"/>
      <rect x="116" y="104" width="16" height="16" rx="2"/>
      <rect x="152" y="104" width="16" height="16" rx="2"/>
    </g>

    <!-- Timeline tracks -->
    <g stroke="#7C3AED" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="20" y1="40" x2="172" y2="40"/>
      <line x1="20" y1="72" x2="140" y2="72" stroke="#A78BFA" stroke-width="2"/>
      <line x1="20" y1="104" x2="156" y2="104" stroke="#A78BFA" stroke-width="2"/>
    </g>

    <!-- Playhead marker -->
    <polygon points="96,30 90,40 102,40" fill="#7C3AED"/>
    <line x1="96" y1="40" x2="96" y2="98" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- "OC" initials -->
  <text x="128" y="218" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle" opacity="0.95">OC</text>
</svg>