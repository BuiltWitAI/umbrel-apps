version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: bwtai-whoami_whoami_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  whoami:
    image: traefik/whoami:latest
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3