version: "3.7"

services:

  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: bwtai-snapotter_snapotter_1
      APP_PORT: 1349
      PROXY_AUTH_ADD: "false"

  snapotter:
    image: snapotter/snapotter:v2.2.0
    user: "1000:1000"
    init: true
    environment:
      - AUTH_ENABLED=true
      - DEFAULT_USERNAME=admin
      - DEFAULT_PASSWORD=admin
      - SKIP_MUST_CHANGE_PASSWORD=false
      - MAX_UPLOAD_SIZE_MB=0
      - MAX_BATCH_SIZE=0
      - MAX_MEGAPIXELS=0
      - CONCURRENT_JOBS=0
      - MAX_WORKER_THREADS=0
      - PROCESSING_TIMEOUT_S=0
      - MAX_PIPELINE_STEPS=20
      - RATE_LIMIT_PER_MIN=1000
      - MAX_USERS=0
      - SESSION_DURATION_HOURS=168
      - TRUST_PROXY=loopback,linklocal,uniquelocal
      - DATABASE_URL=postgres://snapotter:moneyprintergobrrr@bwtai-snapotter_postgres_1:5432/snapotter
      - REDIS_URL=redis://:moneyprintergobrrr@bwtai-snapotter_redis_1:6379
    volumes:
      - ${APP_DATA_DIR}/data/snapotter:/data
      - ${APP_DATA_DIR}/data/workspace:/tmp/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 4
    pids_limit: 512
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - KILL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-sf", "--max-time", "5", "http://localhost:1349/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    shm_size: '2gb'
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    user: "1000:1000"
    environment:
      POSTGRES_USER: snapotter
      POSTGRES_PASSWORD: moneyprintergobrrr
      POSTGRES_DB: snapotter
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    restart: on-failure
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 256
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapotter -d snapotter"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    user: "1000:1000"
    command: >-
      redis-server
      --maxmemory-policy noeviction
      --maxmemory 512mb
      --appendonly yes
      --requirepass moneyprintergobrrr
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    restart: on-failure
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 256
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "moneyprintergobrrr", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s