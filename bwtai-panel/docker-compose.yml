services:
  app_proxy:
    environment:
      APP_HOST: bwtai-panel_panel_1
      APP_PORT: 8000
      PROXY_AUTH_ADD: "false"

  panel:
    image: ghcr.io/calagopus/panel:latest@sha256:c0b1574ea046a222a714aba8272291451fc484851e1bac3866b72f4461b483a9
    restart: on-failure
    environment:
      - TZ=UTC
      - DATABASE_URL=postgresql://panel:${DB_PASSWORD}@bwtai-panel_db_1:5432/panel
      - DATABASE_MIGRATE=true
      - PORT=8000
      - APP_DEBUG=false
      - APP_LOG_DIRECTORY=/var/log/calagopus
      - APP_PRIMARY=true
      - APP_ENABLE_WINGS_PROXY=true
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY}
      - APP_USE_DECRYPTION_CACHE=true
      - APP_USE_INTERNAL_CACHE=true
      - REDIS_URL=redis://:${REDIS_PASSWORD}@bwtai-panel_redis_1:6379
    volumes:
      - ${APP_DATA_DIR}/data:/var/lib/calagopus
      - ${APP_DATA_DIR}/logs:/var/log/calagopus
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: ghcr.io/calagopus/pgautoupgrade:18-alpine@sha256:be9c9d8d5d8b2325fe25d5b7676aa17027a397eebca230c08d5148c766742cdf
    restart: on-failure
    environment:
      - TZ=UTC
      - POSTGRES_USER=panel
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=panel
      - PGDATA=/data
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/data
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel -d panel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    user: "1000:1000"
    image: redis:7-alpine@sha256:e647cfe134bf5e8e74e620f66346f93418acfc240b71dd85640325cb7cd01402
    restart: on-failure
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s