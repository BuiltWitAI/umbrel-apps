description: |
  Calagopus Panel is a modern game server management panel rebuilt from the ground up in Rust. It's a ground-up reimplementation of Pterodactyl Panel with better performance, a refreshed UI, more features, and a cleaner extension model.

  Features:
  - Game server management for Minecraft, Rust, and other games
  - Rust backend built on Tokio and Axum for high performance
  - Modern frontend with React, Mantine, and Tailwind
  - First-class extension system for backend and frontend (plugins, themes)
  - Egg compatible (reuses Pterodactyl-style eggs)
  - Migration path from Pterodactyl and Pelican
  - Wings proxy support for simplified home network setups
  - PostgreSQL database with automatic migrations
  - Redis for caching and background tasks

  Self-hosted on your Umbrel — manage game servers from your home network.

