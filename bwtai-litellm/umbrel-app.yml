description: |
  LiteLLM is an open source AI Gateway that gives you a single, unified interface to call 100+ LLM providers — OpenAI, Anthropic, Gemini, Bedrock, Azure, and more — using the OpenAI format.

  ### Features
  - Unified API for 100+ LLMs (OpenAI, Anthropic, Gemini, etc.)
  - Drop-in OpenAI compatibility - swap providers without rewriting code
  - Virtual keys, spend tracking, and budget management
  - Admin UI for managing models, keys, and configurations
  - Load balancing, fallbacks, and guardrails
  - Built-in logging and monitoring with Prometheus support
  - Python SDK and OpenAI-compatible proxy server

