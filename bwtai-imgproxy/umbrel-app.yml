manifestVersion: 1
id: bwtai-imgproxy
name: imgproxy
tagline: Fast and secure standalone image resizing and processing server
category: utilities
version: "3.7.0"
port: 8096
icon: https://raw.githubusercontent.com/BuiltWitAI/umbrel-apps/master/bwtai-imgproxy/icon.png
description: >-
  imgproxy is a fast and secure standalone server for resizing and processing remote images. It uses a URL-based API to transform images on the fly.

  Features: On-the-fly image resizing, cropping, and format conversion; Support for JPEG, PNG, WebP, AVIF, GIF, TIFF, SVG, PDF; Watermarking and overlays; Color space operations and filters; Presigned URLs with HMAC signatures for security; Local filesystem, S3, HTTP, and Google Cloud Storage sources; Caching with Redis and in-memory LRU; HTTP/2 and TLS support; Prometheus metrics; WebP/AVIF automatic format selection; Gravity-based smart cropping (face detection, entropy, etc.); Image operations: resize, crop, rotate, flip, blur, sharpen, gamma, saturation, brightness, contrast.

  Use cases: Dynamic image optimization for websites/apps; CDN image processing; User-uploaded image transformations; Responsive image delivery; Thumbnail generation.

  Built in Go with libvips for maximum performance.
developer: imgproxy team
website: https://imgproxy.net
