version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: relay
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  relay:
    image: ghcr.io/sanyam-g/airpipe-relay:latest
    restart: on-failure
    environment:
      - PORT=8080
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      # The image has wget built-in (alpine + bundled healthcheck on /health)
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3