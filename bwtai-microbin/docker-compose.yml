version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: microbin
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  microbin:
    image: danielszabo99/microbin:latest
    restart: on-failure
    environment:
      - MICROBIN_BASE_URL=https://{{domain}}
    volumes:
      - ${APP_DATA_DIR}/data:/app/data