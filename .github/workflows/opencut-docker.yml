name: Build and Push OpenCut Docker Image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/opencut-docker.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenCut Classic repository
        uses: actions/checkout@v4
        with:
          repository: opencut-app/opencut-classic
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/builtwitai/bwtai-opencut
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            FREESOUND_CLIENT_ID=${{ secrets.FREESOUND_CLIENT_ID }}
            FREESOUND_API_KEY=${{ secrets.FREESOUND_API_KEY }}
            NEXT_PUBLIC_MARBLE_API_URL=https://api.marblecms.com
            MARBLE_WORKSPACE_KEY=build-placeholder