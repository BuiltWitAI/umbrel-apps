version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bwtai-photoview_photoview_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  photoview:
    image: photoview/photoview:2.4.0@sha256:79229bd913b2453d93ebcb890b7e8c1dddd46215afee1ffa10c5fdb05ba3eb35
    restart: on-failure
    environment:
      - PHOTOVIEW_DATABASE_DRIVER=mysql
      - PHOTOVIEW_MYSQL_URL=photoview:changeme@tcp(db)/photoview
      - PHOTOVIEW_LISTEN_IP=0.0.0.0
    volumes:
      - ${APP_DATA_DIR}/data/photos:/photos:ro
      - ${APP_DATA_DIR}/data/cache:/home/photoview/media-cache
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:lts
    restart: on-failure
    command: mariadbd --innodb-buffer-pool-size=256M --transaction-isolation=READ-COMMITTED --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=256
    environment:
      - MARIADB_DATABASE=photoview
      - MARIADB_USER=photoview
      - MARIADB_PASSWORD=changeme
      - MARIADB_ROOT_PASSWORD=changeme
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 1m
      timeout: 5s
      retries: 5
      start_period: 3m