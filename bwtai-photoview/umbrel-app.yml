manifestVersion: 1
id: bwtai-photoview
name: PhotoView
tagline: Self-hosted photo gallery for photographers
category: media
version: "2.4.0"
port: 18510
icon: https://raw.githubusercontent.com/BuiltWitAI/umbrel-apps/master/bwtai-photoview/icon.png
description: |
  PhotoView is a self-hosted photo gallery designed for photographers. It organizes photos by filesystem directories, supports RAW formats and EXIF parsing, video playback, face recognition, and album sharing.

  ### Features
  - Filesystem-based organization (directories map to albums)
  - RAW format support with EXIF parsing
  - Video support with automatic web optimization
  - Face recognition and grouping
  - User management with per-user photo paths
  - Public album/media sharing with optional password protection
  - High-performance thumbnail generation
  - Secure access with cookie-token authentication

