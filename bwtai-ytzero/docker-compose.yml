version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: ytzero
      APP_PORT: 3001
      # Port INTERNE reste 3001 (port du container)
      # Le port 8190 est le port EXPOSÉ dans le manifest Umbrel
      PROXY_AUTH_ADD: "false"

  ytzero:
    image: ghcr.io/pelski/ytzero:latest
    restart: on-failure
    environment:
      - PORT=3001
      - DB_PATH=/data/db/ytzero.db
      - IMG_CACHE_DIR=/data/imgcache
      - DOWNLOADS_DIR=/data/downloads
      - AVATAR_DIR=/data/avatars
      - LOG_PATH=/data/logs/ytzero.log
      - REFRESH_INTERVAL_MINUTES=5
      - IDLE_TIMEOUT_SECONDS=120
      - YTDLP_AUTO_UPDATE=1
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3