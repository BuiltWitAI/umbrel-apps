description: |
  Thumbor is a smart imaging service that enables on-demand cropping, resizing, applying filters and optimizing images.

  It features AI-powered smart cropping based on face and feature detection (glasses, interesting points, etc.) to ensure perfect crops every time.

  Key features:
  - Supports all common image formats
  - Intelligent cropping and resizing
  - AI-powered face and feature detection
  - Highly extensible via filters and storages
  - Blazing fast performance with caching
