version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: thumbor
      APP_PORT: 8888
      PROXY_AUTH_ADD: "false"

  thumbor:
    image: ghcr.io/thumbor/thumbor:latest
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/thumbor:/data
    environment:
      - THUMBOR_PORT=8888
      - ALLOW_UNSAFE_URL=True
      - SECURITY_KEY=umbrel-secret-key-change-me
